<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8"/>
    <meta name="description" content="Fashion Shaa Corporate POS System - Top Performing Ranks">
    <meta property="og:title" content="Fashion Shaa POS - Rankings">
    <meta property="og:description" content="Fashion Shaa Corporate POS System - Top Performing Ranks">
    <meta property="og:type" content="website">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' http://localhost:* http://127.0.0.1:* https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self'"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Fashion Shaa - Performance Rankings</title>
    <link rel="stylesheet" href="output.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        .glass {
            background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .bg-gradient-mesh {
            background-color: #0f172a;
            background-image: radial-gradient(at 0% 0%, rgba(220, 38, 38, 0.1) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
        }
    </style>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen bg-gradient-mesh">
    <div class="max-w-[1400px] mx-auto px-6 py-8">
        
        <!-- Header Section -->
        <header class="glass rounded-xl px-8 py-4 flex flex-col md:flex-row items-center justify-between gap-4 mb-8 shadow-2xl">
            <div class="flex items-center gap-3">
                <div class="bg-primary p-2 rounded-lg shadow-lg shadow-primary/20">
                    <span class="material-symbols-outlined text-white text-2xl">grid_view</span>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight italic uppercase leading-none">
                        FASHION <span class="text-primary">SHAA</span>
                    </h1>
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mt-1">Stock & Admin Console</p>
                </div>
            </div>
            
            <nav class="flex items-center gap-2">
                <a href="analytics.html" class="px-5 py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-bold text-sm transition-all flex items-center gap-1.5 border border-slate-700">
                    <span class="material-symbols-outlined text-sm">arrow_back</span>
                    <span>Back to Analytics</span>
                </a>
            </nav>
        </header>

        <!-- Metric Rank Selector Tabs -->
        <div class="flex gap-2 mb-8 bg-slate-900/40 p-1.5 rounded-xl border border-white/5 w-fit">
            <button id="tabUnits" class="px-6 py-2.5 rounded-lg font-bold text-sm transition-all bg-primary text-white">
                Units Sold
            </button>
            <button id="tabRevenue" class="px-6 py-2.5 rounded-lg font-bold text-sm transition-all text-slate-400 hover:text-white">
                Revenue Generated
            </button>
            <button id="tabProfit" class="px-6 py-2.5 rounded-lg font-bold text-sm transition-all text-slate-400 hover:text-white">
                Net Profit Generated
            </button>
        </div>

        <!-- Performance charts visualization -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <!-- Items Rank Chart -->
            <div class="glass p-6 rounded-2xl shadow-xl flex flex-col gap-4">
                <h3 id="itemsChartTitle" class="font-bold text-white text-sm uppercase tracking-wider flex items-center gap-1.5 border-b border-white/10 pb-3">
                    <span class="material-symbols-outlined text-[18px] text-primary">analytics</span>
                    Top 5 Products
                </h3>
                <div class="relative w-full h-[300px]">
                    <canvas id="topItemsChart"></canvas>
                </div>
            </div>

            <!-- Categories Rank Chart -->
            <div class="glass p-6 rounded-2xl shadow-xl flex flex-col gap-4">
                <h3 id="catsChartTitle" class="font-bold text-white text-sm uppercase tracking-wider flex items-center gap-1.5 border-b border-white/10 pb-3">
                    <span class="material-symbols-outlined text-[18px] text-secondary">category</span>
                    Top Categories
                </h3>
                <div class="relative w-full h-[300px]">
                    <canvas id="topCategoriesChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Detailed Rankings lists tables -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Categories Table List -->
            <div class="glass p-6 rounded-2xl shadow-xl flex flex-col gap-4">
                <h3 class="font-bold text-white text-sm uppercase tracking-wider flex items-center gap-1.5 border-b border-white/10 pb-3">
                    <span class="material-symbols-outlined text-[18px] text-secondary">view_list</span>
                    Category Rankings
                </h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-800/40 text-slate-400 uppercase tracking-wider font-semibold border-b border-slate-700/50">
                            <tr>
                                <th class="px-3 py-2.5">Rank</th>
                                <th class="px-3 py-2.5">Category</th>
                                <th id="catMetricHeader" class="px-3 py-2.5 text-right">Value</th>
                            </tr>
                        </thead>
                        <tbody id="catsRankTableBody" class="divide-y divide-white/5">
                            <tr>
                                <td colspan="3" class="text-center p-6 text-slate-500 italic">Loading ranked categories...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Items Table List -->
            <div class="glass p-6 rounded-2xl shadow-xl flex flex-col gap-4 lg:col-span-2">
                <h3 class="font-bold text-white text-sm uppercase tracking-wider flex items-center gap-1.5 border-b border-white/10 pb-3">
                    <span class="material-symbols-outlined text-[18px] text-primary">view_list</span>
                    Product Rankings
                </h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-800/40 text-slate-400 uppercase tracking-wider font-semibold border-b border-slate-700/50">
                            <tr>
                                <th class="px-4 py-3">Rank</th>
                                <th class="px-4 py-3">SKU</th>
                                <th class="px-4 py-3">Product Name</th>
                                <th class="px-4 py-3">Category</th>
                                <th id="itemMetricHeader" class="px-4 py-3 text-right">Value</th>
                            </tr>
                        </thead>
                        <tbody id="itemsRankTableBody" class="divide-y divide-white/5">
                            <tr>
                                <td colspan="5" class="text-center p-10 text-slate-500 italic">Loading ranked items...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="database.js"></script>
    <script src="auth-gate.js"></script>
    <script src="top-performing.js"></script>
</body>
</html>
